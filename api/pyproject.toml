[project]
name = "socialops-api"
version = "0.1.0"
description = "SocialOps Phase 1 API — stateless FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16,<2",
    "pydantic>=2.9",
    # Reads env in one place (hard rule #1) with required-by-default validation.
    "pydantic-settings>=2.6",
    # Multipart form parsing for POST /assets (step 6). FastAPI requires it for uploads.
    "python-multipart>=0.0.12",
    # The API enqueues jobs; the worker consumes them. Same queue library both sides.
    "arq>=0.26",
    # Structured JSON logging (hard rule #8).
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    # Synthetic data generation only (data/generate_*.py). Never imported by
    # app/ — these are dev extras precisely so they cannot reach production.
    # PROMPTS.md step 2 names Faker; Pillow draws the sample product images.
    "faker>=30",
    "pillow>=11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; reformatting generated revisions to satisfy a line-length
# rule would mean editing a file whose value is being an exact record of a schema
# change. env.py is ours and stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine fixture is session-scoped. Without these, each test gets a fresh
# event loop while asyncpg connections stay bound to the loop that opened them,
# and the failures read like random flakiness rather than a config problem.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
