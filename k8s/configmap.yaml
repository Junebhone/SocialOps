# Non-secret settings, the same names docker-compose.cloud.yml uses.
# DATABASE_URL is NOT here: it comes from the Secret socialops-db.
apiVersion: v1
kind: ConfigMap
metadata:
  name: socialops-config
data:
  REDIS_URL: "redis://redis:6379/0"
  STORAGE_BACKEND: "s3"
  STORAGE_ROOT: "socialops-uploads-518668548718"
  AWS_REGION: "us-east-2"
  # Ollama runs on no node in this cluster, so the pods use Bedrock (IRSA role
  # socialops-app-irsa grants bedrock:InvokeModel). Cross-region inference profiles
  # for the cheapest Nova pair: Micro for triage, Lite (vision-capable) for the rest.
  LLM_PROVIDER: "bedrock"
  LLM_MODEL_FAST: "us.amazon.nova-micro-v1:0"
  LLM_MODEL_TEXT: "us.amazon.nova-lite-v1:0"
  LLM_MODEL_VISION: "us.amazon.nova-lite-v1:0"
  # Still required by config.py; unused while LLM_PROVIDER is bedrock.
  OLLAMA_BASE_URL: "http://ollama.invalid:11434"
  # The browser's address for the api. web/entrypoint.sh writes it into the
  # bundle at container start, so no image rebuild is needed. Member 3: set the
  # real hostname (search the repo for socialops.example.com).
  NEXT_PUBLIC_API_URL: "https://api.socialops.website"
