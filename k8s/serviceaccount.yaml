# The pods' AWS identity (IRSA). No access keys anywhere: boto3 in api and
# worker picks up the web-identity token EKS mounts for this account.
# The role is created by Member 1 with:
#   eksctl create iamserviceaccount --cluster socialops-eks --namespace socialops \
#     --name socialops-app --role-name socialops-app-irsa --role-only \
#     --attach-policy-arn arn:aws:iam::518668548718:policy/socialops-pod-runtime --approve
apiVersion: v1
kind: ServiceAccount
metadata:
  name: socialops-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::518668548718:role/socialops-app-irsa
