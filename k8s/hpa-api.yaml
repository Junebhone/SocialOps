# 2 to 4 api replicas on CPU. 30% is a DEMO setting so scale-out is visible on
# a small cluster; production would sit near 60-70%. Needs metrics-server and
# the CPU request in api-deployment.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 30}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
