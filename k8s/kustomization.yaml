# Everything the cluster runs, in apply order. Build or dry-run it with:
#   kubectl kustomize k8s/                       # render
#   kubectl apply -k k8s/ --dry-run=client       # validate
#   kubectl apply -k k8s/                        # apply (after the Secret exists)
#
# The Secret socialops-db is deliberately NOT here. It is created by command from
# Secrets Manager (see k8s/README.md), so no secret value ever lands in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: socialops

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - redis.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress-api.yaml
  - ingress-web.yaml
  - hpa-api.yaml
  - pdb.yaml

# One place to move every image, pinned by digest so a re-pushed tag cannot change
# what runs. Comments say which tag each digest is. To move one:
#   docker buildx imagetools inspect <repo>:<tag>     # the index "Digest:" line
images:
  - name: 518668548718.dkr.ecr.us-east-2.amazonaws.com/socialops-api
    digest: sha256:af9ca774b29cdf0a7ee73a7b89b9bc586b9a8c39f2d3cc006326707c7845ef99  # v2
  - name: 518668548718.dkr.ecr.us-east-2.amazonaws.com/socialops-worker
    digest: sha256:a60203449ba9d850c6926622a079432e3c7fc2923817af7565ac56700575c4e7  # v3, Bedrock
  - name: 518668548718.dkr.ecr.us-east-2.amazonaws.com/socialops-web
    digest: sha256:c3b6fee0c81cc1b3bf0141eeff26df4d683d15f8bb7612afaee29e9b999d3d85  # v2
