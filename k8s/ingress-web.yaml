# Member 3 configured the production domain and Issued ACM certificate.
# Web hostname: app.socialops.website
# Both Ingresses share group.name socialops, so they become ONE ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    alb.ingress.kubernetes.io/group.name: socialops
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:518668548718:certificate/982bc78b-710e-46b9-9e4f-ced9ad52eac3
    # The ALB's own health check: a second layer behind the readiness probe.
    alb.ingress.kubernetes.io/healthcheck-path: /inbox
    # Pods already wait 10s in preStop, so 30s of draining is plenty.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: app.socialops.website
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 3000}
