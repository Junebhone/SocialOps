name: socialops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialops}
      POSTGRES_DB: ${POSTGRES_DB:-socialops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialops} -d ${POSTGRES_DB:-socialops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      # Container-internal addresses override whatever .env holds for host-side use.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialops}:${POSTGRES_PASSWORD:-socialops}@postgres:5432/${POSTGRES_DB:-socialops}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - ./data:/app/data
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health/ready, not /health. Liveness answers "is the process up", which
      # stayed true while Postgres was down after the disk filled — four green
      # services in `docker compose ps` and every endpoint returning 500 (D19).
      # Readiness touches Postgres and Redis, so the dashboard tells the truth.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      # Repo root, so the image can copy the api package's SQLAlchemy models —
      # the schema is defined once and shared, never duplicated (D24).
      context: .
      dockerfile: worker/Dockerfile
    command: arq worker.main.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialops}:${POSTGRES_PASSWORD:-socialops}@postgres:5432/${POSTGRES_DB:-socialops}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    volumes:
      - ./worker:/app
      # Dev hot-reload for the shared models; the image already contains a copy.
      - ./api/app:/opt/api/app:ro
      - ./data:/app/data
      - ./storage:/app/storage
      # `make eval` appends its result row here (D5).
      - ./docs:/app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # arq writes a health record to Redis on an interval; `--check` reads it
      # and exits non-zero when it is stale. That is a real liveness signal:
      # `pgrep arq` would stay green through a worker wedged on a model call
      # that never returns, which is the failure actually worth catching here.
      test: ["CMD-SHELL", "arq --check worker.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold 6.6 GB model load on the first job can outlast a short window.
      start_period: 60s

  web:
    build:
      context: ./web
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      # Browser-side calls hit the API through the host port mapping, not the compose
      # network — the browser cannot resolve `api:8000`. Required with no inline default,
      # so the address is configuration rather than a hostname written into a file
      # (hard rule #1). It is set in .env.example.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    healthcheck:
      # wget is busybox's, already in node:24-alpine — no curl to install.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/inbox || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # `next dev` compiles a route on first request, and the first compile of
      # the Inbox is slow enough to fail a tighter window on a cold container.
      start_period: 90s

volumes:
  pgdata:
  redisdata:
