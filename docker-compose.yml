# The production-shaped stack: runtime images, named volumes, one private network,
# nothing but the api and web ports published. This file alone is what the VM runs:
#
#   docker compose -f docker-compose.yml up --build -d      (make up-prod)
#
# A plain `docker compose ...` also merges docker-compose.override.yml, which swaps
# in the dev targets, source bind mounts and hot reload for local work (D33).
#
# Ollama is NOT a service here. It runs on the host and the containers reach it at
# host.docker.internal over the Docker bridge (D34).
name: socialops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialops}
      POSTGRES_DB: ${POSTGRES_DB:-socialops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [socialops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialops} -d ${POSTGRES_DB:-socialops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks: [socialops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    # Secrets and settings reach the process at runtime, never through the image.
    env_file:
      - .env
    environment:
      # Container-internal addresses override whatever .env holds for host-side use.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialops}:${POSTGRES_PASSWORD:-socialops}@postgres:5432/${POSTGRES_DB:-socialops}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/storage
      # Seed scripts and synthetic datasets for `make seed`. Read-only, and data,
      # not code: the image stays the only source of what runs.
      - ./data:/app/data:ro
    networks: [socialops]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /health/ready, not /health. Liveness answers "is the process up", which
      # stayed true while Postgres was down after the disk filled — four green
      # services in `docker compose ps` and every endpoint returning 500 (D19).
      # Readiness touches Postgres and Redis, so the dashboard tells the truth.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      # Repo root, so the image can copy the api package's SQLAlchemy models —
      # the schema is defined once and shared, never duplicated (D24).
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialops}:${POSTGRES_PASSWORD:-socialops}@postgres:5432/${POSTGRES_DB:-socialops}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    volumes:
      # The same volume as the api: it writes an upload, the worker reads it back.
      - uploads:/app/storage
    networks: [socialops]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # arq writes a health record to Redis on an interval; `--check` reads it
      # and exits non-zero when it is stale. That is a real liveness signal:
      # `pgrep arq` would stay green through a worker wedged on a model call
      # that never returns, which is the failure actually worth catching here.
      test: ["CMD-SHELL", "arq --check worker.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold 6.6 GB model load on the first job can outlast a short window.
      start_period: 60s

  web:
    build:
      context: ./web
    environment:
      # Browser-side calls hit the API through the host port mapping, not the compose
      # network — the browser cannot resolve `api:8000`. Required with no inline default,
      # so the address is configuration rather than a hostname written into a file
      # (hard rule #1). It is set in .env.example. The runtime image writes it into
      # the bundle at start (web/entrypoint.sh), so changing it needs the container
      # recreated (`docker compose up` does that), not the image rebuilt.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [socialops]
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      # wget is busybox's, already in node:24-alpine — no curl to install.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/inbox || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  # One user-defined bridge: services resolve each other by name (postgres, redis,
  # api), and nothing outside the stack can join it.
  socialops:

volumes:
  pgdata:
  redisdata:
  # Uploaded images, shared by api and worker. LocalDiskStorage's root (hard rule #9).
  uploads:
