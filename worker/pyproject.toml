[project]
name = "socialops-worker"
version = "0.1.0"
description = "SocialOps Phase 1 worker — arq jobs, pydantic-graph orchestration, Pydantic AI agents"
requires-python = ">=3.12"
dependencies = [
    # Queue. arq owns retries and the DLQ (hard rule #7) — no second durability layer.
    "arq>=0.26",
    # LLM access. Pydantic AI is the only path to a model (hard rule #4); pydantic-graph
    # is the orchestrator (D12). No litellm, no langgraph.
    "pydantic-ai>=1.0",
    "pydantic-graph>=1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # New in step 6 (hard rule #11). The media agent needs an image decoder to
    # do the three things worker/images.py documents: downscale to 1024px as
    # step 6 specifies, apply EXIF rotation so a phone photo is not described
    # sideways, and re-encode. There is no way to do any of that with the
    # standard library, and it is already the api's dev-extra for drawing the
    # sample product images, so it is not a new name in the project.
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ./data is mounted into this container so `make eval` can read eval.json, but
# those scripts belong to the api and import its `app` package. Linting them
# here would sort their imports against a package this container does not have.
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The worker_engine fixture is session-scoped. Without these, each test gets a
# fresh event loop while asyncpg connections stay bound to the loop that opened
# them, and the failure reads as "another operation is in progress" rather than
# as a config problem.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
